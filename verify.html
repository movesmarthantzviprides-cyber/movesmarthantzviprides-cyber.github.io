<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Vehicle – HantzVIPRides</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0A0A0A; color:#ddd; margin:0; padding:20px; }
    .container { max-width:500px; margin:40px auto; background:#121212; padding:30px; border-radius:16px; border:2px solid #FFD700; text-align:center; }
    h1 { color:#FFD700; margin-bottom:10px; }
    input { width:100%; padding:14px; margin:15px 0; background:#1a1a1a; border:1px solid #444; color:#fff; border-radius:8px; font-size:16px; text-align:center; }
    .btn { background:#FFD700; color:#000; padding:14px 28px; border-radius:50px; font-weight:bold; border:none; cursor:pointer; width:100%; margin-top:10px; }
    .result { display:none; margin-top:25px; padding:20px; background:#1a1a1a; border-radius:12px; border:1px solid #333; }
    .valid { border-color:#00C853; }
    .invalid { border-color:#ff4444; }
  </style>
</head>
<body>
  <div class="container">
    <img src="hvr-logo.jpg" alt="HVR Logo" style="width:100px; margin-bottom:15px; border-radius:10px;">
    <h1>Verify HVR Vehicle</h1>
    <p style="color:#aaa; font-size:14px;">Enter Plate Number or scan QR Code</p>

    <input type="text" id="plateInput" placeholder="e.g. ABC-123XY" oninput="this.value = this.value.toUpperCase()">
    
    <button class="btn" onclick="verifyVehicle()">Verify Vehicle</button>

    <div id="result" class="result">
      <h3 id="statusTitle"></h3>
      <p id="statusText"></p>
      <p id="extraInfo" style="font-size:13px; color:#aaa;"></p>
    </div>

    <p style="margin-top:30px; font-size:13px; color:#888;">
      Only vehicles with valid HVR Dispatch status are covered by insurance.
    </p>
    <a href="index.html" style="color:#FFD700; font-size:14px;">← Back to Home</a>
  </div>

  <script>
    // Simple demo verification (replace later with real database)
    const registeredVehicles = {
      "ABC-123XY": { owner: "Hantz Motors", status: "Active", driver: "Verified" },
      "PHC-456AB": { owner: "Chinedu Okoro", status: "Active", driver: "Verified" },
      "BNY-789CD": { owner: "Amaka Eze", status: "Pending Pre-Mob", driver: "Under Review" }
    };

    function verifyVehicle() {
      const plate = document.getElementById('plateInput').value.trim().toUpperCase();
      const resultDiv = document.getElementById('result');
      const title = document.getElementById('statusTitle');
      const text = document.getElementById('statusText');
      const extra = document.getElementById('extraInfo');

      if (!plate) {
        alert("Please enter a plate number");
        return;
      }

      resultDiv.style.display = 'block';

      if (registeredVehicles[plate]) {
        const v = registeredVehicles[plate];
        resultDiv.className = 'result valid';
        title.innerHTML = "✅ VERIFIED HVR VEHICLE";
        title.style.color = "#00C853";
        text.innerHTML = `<strong>Plate:</strong> ${plate}<br><strong>Status:</strong> ${v.status}`;
        extra.innerHTML = `Owner: ${v.owner}<br>Driver: ${v.driver}`;
      } else {
        resultDiv.className = 'result invalid';
        title.innerHTML = "❌ NOT REGISTERED";
        title.style.color = "#ff4444";
        text.innerHTML = "This vehicle is not on the HantzVIPRides platform.";
        extra.innerHTML = "Please contact HVR operations if this is an error.";
      }
    }
  </script>
</body>
</html>
