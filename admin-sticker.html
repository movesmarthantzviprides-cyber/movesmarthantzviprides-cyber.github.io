<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HVR Admin – Generate Vehicle Sticker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0A0A0A;
      color: #ddd;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      color: #FFD700;
      text-align: center;
      margin-bottom: 10px;
    }
    .form-box {
      background: #121212;
      padding: 25px;
      border-radius: 14px;
      border: 2px solid #FFD700;
      margin-bottom: 30px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      background: #1a1a1a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      text-transform: uppercase;
    }
    .btn {
      background: #FFD700;
      color: #000;
      padding: 14px;
      border-radius: 50px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-size: 16px;
    }
    .btn-secondary {
      background: #333;
      color: #FFD700;
      border: 2px solid #FFD700;
    }

    /* STICKER PREVIEW */
    .sticker {
      width: 340px;
      background: #0A0A0A;
      border: 6px solid #FFD700;
      border-radius: 16px;
      padding: 22px 18px;
      text-align: center;
      color: #fff;
      margin: 0 auto;
      display: none;
    }
    .sticker.show { display: block; }
    .logo { width: 95px; margin-bottom: 8px; border-radius: 8px; }
    .brand { font-size: 15px; color: #FFD700; font-weight: bold; }
    .sub { font-size: 12px; color: #ccc; margin-bottom: 10px; }
    .plate {
      background: #FFD700;
      color: #000;
      font-size: 24px;
      font-weight: 900;
      padding: 10px 16px;
      border-radius: 8px;
      margin: 12px 0;
      letter-spacing: 2px;
    }
    .qr {
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      display: inline-block;
      margin: 10px 0;
    }
    .qr img { width: 145px; height: 145px; }
    .footer { font-size: 13px; color: #FFD700; margin-top: 8px; font-weight: bold; }
    .hotline {
      background: #1a1a1a;
      border: 1px solid #FFD700;
      border-radius: 8px;
      padding: 8px;
      margin-top: 12px;
      font-size: 14px;
      font-weight: bold;
    }
    .hotline span { color: #FFD700; }
    .note { font-size: 11px; color: #aaa; margin-top: 10px; }

    @media print {
      body * { visibility: hidden; }
      .sticker, .sticker * { visibility: visible; }
      .sticker {
        position: absolute;
        left: 50%;
        top: 20px;
        transform: translateX(-50%);
        box-shadow: none;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>HVR Admin</h1>
    <p style="text-align:center; color:#aaa; margin-bottom:25px;">Generate Vehicle Sticker</p>

    <div class="form-box no-print">
      <label style="color:#FFD700; font-weight:bold;">Enter Vehicle Plate Number</label>
      <input type="text" id="plateInput" placeholder="e.g. ABC-123XY" maxlength="12">
      
      <button class="btn" onclick="generateSticker()">Generate Sticker</button>
      <button class="btn btn-secondary" onclick="window.print()" style="margin-top:10px;">🖨️ Print Sticker</button>
      <a href="admin.html" class="btn btn-secondary" style="display:block; text-align:center; margin-top:10px; text-decoration:none;">← Back to Admin</a>
    </div>

    <!-- Generated Sticker -->
    <div id="sticker" class="sticker">
      <img src="hvr-logo.jpg" alt="HVR Logo" class="logo">
      <div class="brand">HANTZVIPRIDES</div>
      <div class="sub">Verified Vehicle</div>

      <div class="plate" id="plateDisplay">ABC-123XY</div>

      <div class="qr">
        <img id="qrImage" src="" alt="QR Code">
      </div>

      <div class="footer">SCAN OR TAP TO VERIFY</div>

      <div class="hotline">
        Hotline: <span>0808 552 6104</span>
      </div>

      <div class="note">
        Valid only with active HVR Dispatch Certificate<br>
        Insured by Leadway Assurance
      </div>
    </div>
  </div>

  <script>
    function generateSticker() {
      const plate = document.getElementById('plateInput').value.trim().toUpperCase();
      
      if (!plate) {
        alert("Please enter a plate number");
        return;
      }

      // Show sticker
      document.getElementById('sticker').classList.add('show');
      document.getElementById('plateDisplay').textContent = plate;

      // Generate QR Code
      const verifyUrl = `https://movesmarthantzviprides-cyber.github.io/verify.html?plate=${plate}`;
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=145x145&data=${encodeURIComponent(verifyUrl)}`;
      
      document.getElementById('qrImage').src = qrUrl;

      // Scroll to sticker
      document.getElementById('sticker').scrollIntoView({ behavior: 'smooth' });
    }

    // Allow pressing Enter
    document.getElementById('plateInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') generateSticker();
    });
  </script>
</body>
</html>
