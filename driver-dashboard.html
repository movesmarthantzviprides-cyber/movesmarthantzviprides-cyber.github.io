<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Dashboard – HANTZVIPRIDES</title>
  <style>
    :root { --gold: #E8B923; --deep: #0A0A0A; --card: #121212; }
    * { box-sizing: border-box; margin:0; padding:0; }
    body { font-family: Arial, Helvetica, sans-serif; background: var(--deep); color: #ddd; }
    .header { background:#000; padding:20px; border-bottom:3px solid var(--gold); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
    .header h1 { color:var(--gold); font-size:22px; }
    .container { max-width:1100px; margin:0 auto; padding:30px 20px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px,1fr)); gap:20px; margin:30px 0; }
    .card { background:var(--card); padding:25px; border-radius:14px; border:1px solid #333; }
    .card h3 { color:var(--gold); margin-bottom:10px; }
    .stat { font-size:28px; font-weight:900; color:#00FF88; }
    .btn { background:var(--gold); color:#000; padding:12px 24px; border-radius:50px; text-decoration:none; font-weight:900; display:inline-block; margin-top:10px; }
    .live { display:inline-block; width:10px; height:10px; background:#00FF88; border-radius:50%; margin-right:8px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity:1; } 50% { opacity:0.4; } 100% { opacity:1; } }
    table { width:100%; border-collapse:collapse; margin-top:20px; }
    th, td { padding:12px; text-align:left; border-bottom:1px solid #333; }
    th { color:var(--gold); }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="live"></span> HVR Driver Dashboard (Live)</h1>
    <a href="index.html" class="btn">← Back to Site</a>
  </div>

  <div class="container">
    <h2 style="color:var(--gold);">Welcome, Driver</h2>
    <p style="color:#aaa;">Last updated: <span id="lastUpdate">just now</span></p>

    <div class="grid">
      <div class="card">
        <h3>Today’s Trips</h3>
        <div class="stat" id="trips">3</div>
      </div>
      <div class="card">
        <h3>Earnings (Today)</h3>
        <div class="stat" id="earnings">₦48,500</div>
      </div>
      <div class="card">
        <h3>Seats Booked (Next Trip)</h3>
        <div class="stat" id="seats">4/7</div>
      </div>
      <div class="card">
        <h3>Next Departure</h3>
        <div class="stat" style="font-size:20px;" id="nextTrip">BNY → PHC 2:00 PM</div>
      </div>
    </div>

    <div class="card">
      <h3>Live Boarding Status</h3>
      <table>
        <thead>
          <tr>
            <th>Route</th>
            <th>Time</th>
            <th>Booked</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="boardingTable">
          <tr>
            <td>BNY → PHC</td>
            <td>2:00 PM</td>
            <td>4/7</td>
            <td style="color:#00FF88;">Boarding</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Simulated real-time updates
    const routes = [
      { route: "BNY → PHC", time: "2:00 PM", seats: "4/7" },
      { route: "PHC → BNY", time: "4:00 PM", seats: "2/7" },
      { route: "BNY → Warri", time: "6:00 AM", seats: "5/7" }
    ];

    function updateDashboard() {
      const randomSeats = Math.floor(Math.random() * 4) + 3;
      document.getElementById('seats').textContent = randomSeats + "/7";
      document.getElementById('earnings').textContent = "₦" + (45000 + Math.floor(Math.random() * 15000)).toLocaleString();
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
      
      const tbody = document.getElementById('boardingTable');
      tbody.innerHTML = `
        <tr>
          <td>BNY → PHC</td>
          <td>2:00 PM</td>
          <td>${randomSeats}/7</td>
          <td style="color:#00FF88;">Boarding</td>
        </tr>
      `;
    }

    // Update every 8 seconds
    setInterval(updateDashboard, 8000);
  </script>
</body>
</html>
