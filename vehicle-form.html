<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Registration – HANTZVIPRIDES</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#0A0A0A; color:#ddd; margin:0; padding:0; }
    .container { max-width:600px; margin:40px auto; padding:30px; background:#121212; border-radius:16px; border:2px solid #E8B923; }
    h1 { color:#E8B923; text-align:center; margin-bottom:10px; }
    p { text-align:center; color:#aaa; margin-bottom:30px; }
    input, select { width:100%; padding:14px; margin:10px 0; background:#1a1a1a; border:1px solid #444; color:#fff; border-radius:8px; font-size:16px; }
    .btn { background:#E8B923; color:#000; padding:16px; border-radius:50px; text-decoration:none; font-weight:900; display:block; text-align:center; margin-top:15px; border:none; cursor:pointer; font-size:16px; }
    .btn-secondary { background:#333; color:#E8B923; border:2px solid #E8B923; }
    .g-recaptcha { margin:20px 0; display:flex; justify-content:center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚙 Vehicle Profiling & Pre-Mob</h1>
    <p>Owner’s Registration Form</p>

    <form action="https://formspree.io/f/YOUR_VEHICLE_FORM_ID" method="POST">
      <input type="text" name="owner_name" placeholder="Owner Full Name" required minlength="3">
      <input type="tel" name="phone" placeholder="Phone Number (11 digits)" required pattern="[0-9]{11}" title="Enter 11-digit number">
      <input type="text" name="plate" placeholder="Vehicle Plate Number" required>
      <select name="vehicle_type" required>
        <option value="">Select Vehicle Type</option>
        <option value="Sienna">Sienna</option>
        <option value="Hiace">Hiace</option>
        <option value="Coaster">Coaster</option>
        <option value="SUV / Prado">SUV / Prado</option>
        <option value="Camry / Executive">Camry / Executive</option>
      </select>
      <input type="text" name="location" placeholder="Current Location (City)" required>

      <!-- Success redirect -->
      <input type="hidden" name="_next" value="https://movesmarthantzviprides-cyber.github.io/thank-you.html">
      <input type="hidden" name="_subject" value="New Vehicle Registration - HANTZVIPRIDES">

      <!-- reCAPTCHA (replace YOUR_SITE_KEY) -->
      <div class="g-recaptcha" data-sitekey="YOUR_SITE_KEY_HERE"></div>

      <button type="submit" class="btn">Submit Online via Formspree</button>
    </form>

    <p style="margin-top:25px; font-size:14px; color:#aaa;">
      After online submission, complete physical verification & hardcopy documents:
    </p>
    <a href="https://wa.me/2349082483452?text=I%20have%20submitted%20the%20Vehicle%20form%20online%20and%20want%20to%20do%20physical%20verification" class="btn btn-secondary">
      WhatsApp for Physical Verification & Hardcopies
    </a>

    <a href="applications.html" class="btn btn-secondary" style="margin-top:15px;">← Back to Applications</a>
  </div>

  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</body>
</html>
