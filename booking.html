<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book House2House VIP Ride | HantzVIPRides</title>
<style>
  body{
    background:#0a0a0a;
    color:#fff;
    font-family:'Segoe UI',Arial,sans-serif;
    margin:0;
    padding:0;
  }
 .container{
    max-width:650px;
    margin:40px auto;
    padding:30px 20px;
    background:#111;
    border:1px solid #FFD700;
    border-radius:16px;
  }
  h1{
    text-align:center;
    color:#FFD700;
    font-weight:900;
    margin-bottom:10px;
  }
  p.sub{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
  }
  label{
    display:block;
    margin:12px 0 6px;
    font-weight:700;
    color:#FFD700;
  }
  input, select, textarea{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #333;
    background:#0a0a0a;
    color:#fff;
    font-size:1rem;
    box-sizing:border-box;
  }
  input:focus, select:focus, textarea:focus{
    outline:none;
    border:1px solid #00C853;
  }
  button{
    width:100%;
    background:#25D366;
    color:#fff;
    padding:14px;
    border:none;
    border-radius:8px;
    font-weight:900;
    font-size:1.1rem;
    margin-top:20px;
    cursor:pointer;
  }
  button:hover{
    background:#22c55e;
  }
 .note{
    font-size:0.85rem;
    color:#00C853;
    text-align:center;
    margin-top:12px;
  }
 .trust{
    background:#000;
    border:1px solid #FFD700;
    border-radius:10px;
    padding:12px;
    margin-top:25px;
    text-align:center;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🚐 Book Your House2House VIP Ride</h1>
  <p class="sub">From the comfort of your house to your destination. Verified. Insured. Tracked.</p>

  <form id="bookingForm">

    <label>Full Name</label>
    <input type="text" name="name" placeholder="John Doe" required>

    <label>WhatsApp Number</label>
    <input type="tel" name="whatsapp" placeholder="0808 552 6104" required>

    <label>Pickup From</label>
    <input type="text" name="pickup" placeholder="e.g. 12 Bonny Estate, Bonny" required>

    <label>Dropoff To</label>
    <input type="text" name="dropoff" placeholder="e.g. 5 GRA, Port Harcourt" required>

    <label>Date of Travel</label>
    <input type="date" id="travelDate" name="date" required>

    <label>Time of Travel</label>
    <input type="time" name="time" required>

    <label>Service Type</label>
    <select name="service" required>
      <option value="">-- Select Service --</option>
      <option value="VIP - Sedan/SUV">VIP - Sedan/SUV</option>
      <option value="VIP - Executive Bus">VIP - Executive Bus</option>
      <option value="Semi-VIP">Semi-VIP</option>
    </select>

    <label>Additional Notes</label>
    <textarea name="notes" rows="3" placeholder="Luggage, special request, etc."></textarea>

    <button type="submit">📱 Send Booking to WhatsApp</button>
    <p class="note">⏰ Driver details will be sent to you 2hrs before trip time</p>

  </form>

  <div class="trust">
    <p style="margin:0; font-size:0.9rem; color:#FFD700; font-weight:700;">
      ✅ Official Bank: First Bank &nbsp;|&nbsp; ✅ Insured by: Leadway Assurance
    </p>
    <p style="margin:4px 0 0 0; font-size:0.75rem; color:#aaa;">All HVR trips 100% covered</p>
  </div>
</div>

<script>
  // Block past dates
  const dateInput = document.getElementById('travelDate');
  const today = new Date().toISOString().split('T')[0];
  if(dateInput){
    dateInput.min = today;
  }

  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = this.name.value;
    const phone = this.whatsapp.value;
    const pickup = this.pickup.value;
    const dropoff = this.dropoff.value;
    const date = this.date.value;
    const time = this.time.value;
    const service = this.service.value;
    const notes = this.notes.value || 'None';

    const message =
`Hello HantzVIPRides 👋

I want to book a House2House VIP Ride

*Name:* ${name}
*WhatsApp:* ${phone}
*From:* ${pickup}
*To:* ${dropoff}
*Date:* ${date}
*Time:* ${time}
*Service:* ${service}
*Notes:* ${notes}

_Note: Driver assignment is done from 2hrs before trip time_`;

    window.open(`https://wa.me/2348085526104?text=${encodeURIComponent(message)}`, '_blank');

    this.reset();
    if(dateInput) dateInput.min = today;
  });
</script>

</body>
</html>
